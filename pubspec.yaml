name: somiti_app
description: A new Flutter project.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  http: ^1.1.0
  google_fonts: ^6.1.0
  carousel_slider: ^5.0.0
  shared_preferences: 2.2.2 
  intl: ^0.18.1
  fl_chart: ^0.65.0
  marquee: ^2.2.3
  # 🔥 youtube_player_flutter ভার্সন আপগ্রেড করা হলো
  youtube_player_flutter: ^9.0.4 

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0
  flutter_launcher_icons: ^0.13.1 

flutter_launcher_icons:
  android: "launcher_icon"
  ios: false
  image_path: "assets/app_logo.png" 

# 🔥 নিশ্চিত করা হলো যেন flutter_inappwebview নতুন ভার্সন ব্যবহার করে
dependency_overrides:
  flutter_inappwebview: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/