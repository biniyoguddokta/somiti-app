name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Recreate Flutter Platform Folders
      run: flutter create .

    - name: Install dependencies
      run: flutter pub get

    - name: Add Internet Permission
      run: sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

    # 🔥 ১. অ্যাপের নাম পরিবর্তন করার নতুন স্টেপ
    - name: Change App Name
      run: |
        sed -i 's/android:label="somiti_app"/android:label="বিনিয়োগ উদ্যোক্তা"/g' android/app/src/main/AndroidManifest.xml

    # ২. ProGuard রুলস ফাইল তৈরি করা হচ্ছে
    - name: Create ProGuard Rules
      run: |
        mkdir -p android/app
        cat << 'EOF' > android/app/proguard-rules.pro
        -keep class kotlin.Unit { *; }
        -keep class kotlin.Result { *; }
        -keep class kotlin.Result$Failure { *; }
        -keep class kotlin.coroutines.Continuation { *; }
        -keep class kotlin.coroutines.intrinsics.CoroutineSingletons { *; }
        -keep class kotlin.coroutines.intrinsics.IntrinsicsKt { *; }
        EOF

    # ৩. build.gradle ফাইলে proguard-rules.pro যুক্ত করা হচ্ছে
    - name: Configure ProGuard in build.gradle
      run: |
        if [ -f android/app/build.gradle.kts ]; then
          echo "Configuring build.gradle.kts..."
          sed -i 's/release {/release {\n            proguardFiles(getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro")/' android/app/build.gradle.kts
        elif [ -f android/app/build.gradle ]; then
          echo "Configuring build.gradle..."
          sed -i 's/release {/release {\n            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"/' android/app/build.gradle
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk