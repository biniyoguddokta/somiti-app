name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Recreate Flutter Platform Folders
      run: flutter create .

    - name: Install dependencies
      run: flutter pub get

    # 🔥 429 Error Fix: Google Maven Mirror ব্যবহার করা হলো
    - name: Fix Gradle Repositories (429 Fix)
      run: |
        cat << 'EOF' > android/settings.gradle.kts
        pluginManagement {
            val flutterSdkPath = run {
                val properties = java.util.Properties()
                file("local.properties").inputStream().use { properties.load(it) }
                val flutterSdkPath = properties.getProperty("flutter.sdk")
                require(flutterSdkPath != null) { "flutter.sdk not set in local.properties" }
                flutterSdkPath
            }

            includeBuild("$flutterSdkPath/packages/flutter_tools/gradle")

            repositories {
                google()
                mavenCentral()
                gradlePluginPortal()
            }
        }

        plugins {
            id("dev.flutter.flutter-plugin-loader") version "1.0.0"
            id("com.android.application") version "8.1.0" apply false
            id("org.jetbrains.kotlin.android") version "1.9.0" apply false
        }

        include(":app")
        EOF

        # Maven Central এর 429 এড়াতে Google এর মিরর ব্যবহার করা হচ্ছে
        cat << 'EOF' > android/build.gradle.kts
        allprojects {
            repositories {
                google()
                mavenCentral()
                maven { url = uri("https://maven-central.storage-download.googleapis.com/maven2/") }
            }
        }
        EOF

    - name: Add Internet Permission
      run: sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

    - name: Fix R8 ProGuard Issue
      run: echo "android.r8.proguardAndroidTxt.disallowed=false" >> android/gradle.properties

    - name: Disable R8 Minification
      run: |
        if [ -f android/app/build.gradle.kts ]; then
          echo "Configuring build.gradle.kts..."
          sed -i 's/isMinifyEnabled true/isMinifyEnabled false/g' android/app/build.gradle.kts
          sed -i 's/isShrinkResources true/isShrinkResources false/g' android/app/build.gradle.kts
        elif [ -f android/app/build.gradle ]; then
          echo "Configuring build.gradle..."
          sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
          sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle
        fi

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk