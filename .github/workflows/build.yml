name: Build APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Java
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '17'

    - name: Set up Flutter
      uses: subosito/flutter-action@v2
      with:
        channel: 'stable'

    - name: Recreate Flutter Platform Folders
      run: flutter create .

    - name: Install dependencies
      run: flutter pub get

    - name: Add Internet Permission
      run: sed -i 's/<application/<uses-permission android:name="android.permission.INTERNET"\/>\n    <application/' android/app/src/main/AndroidManifest.xml

    # 🔥 এই অংশটুকু নতুন যোগ করা হয়েছে (R8 অপটিমাইজেশন বন্ধ করার জন্য)
    - name: Disable R8 Minification
      run: |
        sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle
        sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle
        sed -i 's/minifyEnabled true/minifyEnabled false/g' android/app/build.gradle.kts
        sed -i 's/shrinkResources true/shrinkResources false/g' android/app/build.gradle.kts

    - name: Build APK
      run: flutter build apk --release

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: release-apk
        path: build/app/outputs/flutter-apk/app-release.apk